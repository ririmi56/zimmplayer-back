[project]
name = "zimmplayer-back"
version = "0.1.0"
description = "Catalogue et streaming d'une bibliotheque musicale stockee sur S3/MinIO"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pymysql>=1.1",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "mutagen>=1.47",
    "pillow>=11.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
